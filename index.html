<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLENER Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .balance-title { color: #94a3b8; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .balance { font-size: 56px; font-weight: bold; color: #10b981; margin: 10px 0; }
        .balance span { font-size: 24px; color: #34d399; }
        .address { background-color: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #cbd5e1; word-break: break-all; margin-bottom: 20px; border: 1px solid #334155; }
        .stats { display: flex; justify-content: space-between; border-top: 1px solid #334155; padding-top: 20px; margin-top: 20px; }
        .stat-item { text-align: left; }
        .stat-label { color: #94a3b8; font-size: 12px; }
        .stat-value { font-size: 18px; font-weight: bold; color: #f8fafc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>MOLENER</h1>
        <div class="subtitle">Личный кабинет основателя</div>
        
        <div class="balance-title">Ваш баланс</div>
        <div class="balance" id="founder-balance">Загрузка...</div>
        
        <div class="address" id="wallet-address">Загрузка адреса...</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">В пуле протокола</div>
                <div class="stat-value"><span id="pool-balance">0</span> M</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Сожжено</div>
                <div class="stat-value"><span id="burned-total">0</span> M</div>
            </div>
        </div>
    </div>

    <script>
        // Этот скрипт автоматически читает файл ledger.json и вставляет цифры на страницу
        fetch('ledger.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('founder-balance').innerHTML = data.balances.founder_address + ' <span>MOLENER</span>';
                document.getElementById('pool-balance').innerText = data.balances.protocol_pool;
                document.getElementById('burned-total').innerText = data.burned_total;
                
                // Если в ledger.json есть адрес основателя, можно его тоже вывести (пока скрыто)
                // document.getElementById('wallet-address').innerText = data.founder_wallet || '0x7433...3c47';
            })
            .catch(error => {
                document.getElementById('founder-balance').innerText = 'Ошибка загрузки';
                console.error('Ошибка:', error);
            });
    </script>
</body>
</html>
